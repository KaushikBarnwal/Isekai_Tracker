{% extends 'base.html' %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[80vh] px-4 text-center relative z-10">
    <div class="mb-8">
        <span class="text-8xl md:text-9xl drop-shadow-[0_0_30px_rgba(167,139,250,0.4)] animate-pulse">⚔️</span>
    </div>
    
    <h1 class="text-5xl md:text-7xl font-black mb-6 tracking-tight bg-gradient-to-r from-indigo-400 via-purple-400 to-amber-400 bg-clip-text text-transparent">
        Isekai Tracker
    </h1>
    
    <p class="text-xl md:text-2xl text-slate-300 max-w-2xl mb-12 leading-relaxed">
        Your real-world steps fuel your fantasy adventure. Walk every day to level up, unlock new regions, and generate AI-driven chronicles of your epic journey.
    </p>
    
    <div class="flex flex-col sm:flex-row gap-6">
        <a href="{% url 'register' %}" class="px-8 py-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 rounded-xl font-bold text-white text-lg tracking-wide shadow-[0_0_20px_rgba(99,102,241,0.5)] transform hover:scale-105 transition-all duration-300">
            Begin Your Legacy
        </a>
        <a href="{% url 'login' %}" class="px-8 py-4 bg-slate-800 hover:bg-slate-700 border border-slate-600 hover:border-indigo-400 rounded-xl font-bold text-slate-200 text-lg tracking-wide shadow-lg transform hover:scale-105 transition-all duration-300">
            Return to Stronghold
        </a>
    </div>
</div>
{% endblock %}
