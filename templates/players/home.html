{% extends 'base.html' %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[80vh] px-4 text-center relative z-10">
    <div class="mb-6">
        <span class="text-7xl md:text-8xl" style="filter: drop-shadow(0 0 20px var(--rpg-glow));">⚔️</span>
    </div>
    
    <h1 class="font-rpg text-4xl md:text-6xl font-bold mb-5 tracking-wide rpg-accent-text" style="text-shadow: 0 0 30px var(--rpg-glow);">
        Isekai Tracker
    </h1>
    
    <p class="text-lg md:text-xl rpg-muted max-w-2xl mb-10 leading-relaxed">
        Your real-world steps fuel your fantasy adventure. Walk every day to level up, unlock new regions, and generate AI-driven chronicles of your epic journey.
    </p>
    
    <div class="flex flex-col sm:flex-row gap-4">
        <a href="{% url 'register' %}" class="rpg-btn px-8 py-3.5 bg-gradient-to-br from-indigo-700 to-indigo-900 border-2 border-indigo-400/40 text-white text-base tracking-widest font-rpg" style="box-shadow: 0 4px 25px rgba(99,102,241,0.3);">
            Begin Your Legacy
        </a>
        <a href="{% url 'login' %}" class="rpg-btn rpg-panel px-8 py-3.5 border-2 rpg-heading text-base tracking-widest font-rpg hover:border-indigo-500/50">
            Return to Stronghold
        </a>
    </div>
</div>
{% endblock %}
