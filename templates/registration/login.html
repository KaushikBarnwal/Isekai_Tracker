{% extends 'base.html' %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 relative z-10">
    <div class="max-w-md w-full rpg-panel rpg-ornament p-7 relative overflow-hidden">
        
        <div class="text-center mb-6 relative z-10">
            <span class="text-4xl block mb-3">🔮</span>
            <h2 class="font-rpg text-2xl font-bold rpg-heading tracking-wide">Return to Stronghold</h2>
            <p class="rpg-accent-text mt-1.5 text-sm">Log in to resume your journey.</p>
        </div>

        <form method="post" class="space-y-5 relative z-10">
            {% csrf_token %}
            
            <div class="space-y-3">
                {{ form.as_p }}
            </div>
            
            <button type="submit" class="rpg-btn w-full py-3 border-2 text-base rpg-heading tracking-widest font-rpg" style="background: var(--rpg-surface-elevated); border-color: var(--rpg-accent);">
                Enter World
            </button>
            
            <input type="hidden" name="next" value="{{ next|default:'/dashboard/' }}">
        </form>
        
        <p class="text-center mt-5 rpg-muted text-sm relative z-10">
            A new soul? <a href="{% url 'register' %}" class="rpg-accent-text hover:brightness-125 font-bold ml-1">Forge your destiny</a>
        </p>
    </div>
</div>

<style>
/* RPG form overrides */
form p { margin-bottom: 0.75rem; }
form label { display: block; margin-bottom: 0.4rem; font-size: 0.8rem; font-weight: 600; color: var(--rpg-text-muted); font-family: var(--font-heading); text-transform: uppercase; letter-spacing: 0.1em; }
form input { width: 100%; padding: 0.65rem 0.85rem; background-color: var(--rpg-input-bg); border: 2px solid var(--rpg-border); border-radius: 3px; color: var(--rpg-text); outline: none; transition: all 0.2s; font-size: 0.9rem; }
form input:focus { border-color: var(--rpg-accent); box-shadow: 0 0 8px var(--rpg-glow); }
</style>
{% endblock %}
