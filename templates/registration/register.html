{% extends 'base.html' %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 relative z-10">
    <div class="max-w-md w-full bg-slate-900/80 backdrop-blur-xl border border-white/10 p-8 rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
        <div class="text-center mb-8">
            <span class="text-5xl block mb-4">✨</span>
            <h2 class="text-3xl font-black text-white tracking-tight">Forge Your Destiny</h2>
            <p class="text-indigo-300 mt-2 font-medium">Create a new hero profile.</p>
        </div>

        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            <div class="space-y-4 text-slate-300 appearance-none">
                {{ form.as_p }}
            </div>
            
            <button type="submit" class="w-full py-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 rounded-xl font-bold text-white text-lg shadow-[0_0_15px_rgba(99,102,241,0.4)] transition-all transform hover:-translate-y-1">
                Create Hero
            </button>
        </form>
        
        <p class="text-center mt-6 text-slate-400">
            Already have an account? <a href="{% url 'login' %}" class="text-indigo-400 hover:text-indigo-300 font-bold ml-1">Log in</a>
        </p>
    </div>
</div>

<style>
/* Quick Tailwind overrides for the Django form rendering */
form p { margin-bottom: 1rem; }
form label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; font-weight: 600; color: #cbd5e1; }
form input { width: 100%; padding: 0.75rem 1rem; background-color: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 0.75rem; color: white; outline: none; transition: all 0.2s; }
form input:focus { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
.helptext { font-size: 0.75rem; color: #64748b; margin-top: 0.25rem; display: block; }
ul.errorlist { color: #f87171; font-size: 0.875rem; margin-bottom: 0.5rem; }
</style>
{% endblock %}
